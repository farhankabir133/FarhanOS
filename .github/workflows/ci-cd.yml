name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

  build:
    name: Build Frontend & Backend
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend (TypeScript)
        run: npm run build:backend

      - name: Build frontend (Vite)
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
          retention-days: 7

  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [lint-and-test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend (TypeScript)
        run: npm run build:backend

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service farhanos-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: .

  smoke-test:
    name: Smoke Test Production API
    runs-on: ubuntu-latest
    needs: deploy-railway
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Wait for deployment propagation
        run: sleep 30

      - name: Test health endpoint
        run: |
          curl -f https://api.farhankabir.me/api/health || (echo "Health check failed" && exit 1)

      - name: Test ask-twin endpoint
        run: |
          curl -X POST https://api.farhankabir.me/api/ask-twin \
            -H "Content-Type: application/json" \
            -d '{"message":"Hello from CI"}' \
            || (echo "ask-twin check failed" && exit 1)

      - name: Test CORS headers
        run: |
          curl -I -X OPTIONS https://api.farhankabir.me/api/health \
            -H "Origin: https://farhankabir.me" \
            -H "Access-Control-Request-Method: GET" \
            | grep -i "access-control-allow-origin" || (echo "CORS check failed" && exit 1)
