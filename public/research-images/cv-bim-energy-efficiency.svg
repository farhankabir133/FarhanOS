<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg2)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06b6d4" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="800" height="600" fill="url(#grid2)"/>
  
  <!-- BIM Building wireframe -->
  <g opacity="0.5">
    <rect x="280" y="180" width="240" height="280" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="280" y1="240" x2="520" y2="240" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <line x1="280" y1="300" x2="520" y2="300" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <line x1="280" y1="360" x2="520" y2="360" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <line x1="280" y1="420" x2="520" y2="420" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <line x1="340" y1="180" x2="340" y2="460" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <line x1="400" y1="180" x2="400" y2="460" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <line x1="460" y1="180" x2="460" y2="460" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Computer Vision camera overlay -->
  <g transform="translate(620, 120)">
    <rect x="0" y="0" width="100" height="80" rx="8" fill="none" stroke="url(#accent2)" stroke-width="2.5" filter="url(#glow2)"/>
    <circle cx="50" cy="40" r="18" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
    <circle cx="50" cy="40" r="6" fill="#3b82f6" opacity="0.6"/>
    <line x1="0" y1="0" x2="20" y2="20" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="100" y1="0" x2="80" y2="20" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="80" x2="20" y2="60" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="100" y1="80" x2="80" y2="60" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Digital twin nodes -->
  <g opacity="0.6">
    <circle cx="200" cy="120" r="8" fill="none" stroke="#06b6d4" stroke-width="2" filter="url(#glow2)"/>
    <circle cx="200" cy="200" r="8" fill="none" stroke="#06b6d4" stroke-width="2" filter="url(#glow2)"/>
    <circle cx="200" cy="280" r="8" fill="none" stroke="#06b6d4" stroke-width="2" filter="url(#glow2)"/>
    
    <circle cx="600" cy="140" r="8" fill="none" stroke="#3b82f6" stroke-width="2" filter="url(#glow2)"/>
    <circle cx="600" cy="220" r="8" fill="none" stroke="#3b82f6" stroke-width="2" filter="url(#glow2)"/>
    <circle cx="600" cy="300" r="8" fill="none" stroke="#3b82f6" stroke-width="2" filter="url(#glow2)"/>
    
    <!-- Twin sync lines -->
    <line x1="208" y1="120" x2="592" y2="140" stroke="#06b6d4" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
    <line x1="208" y1="200" x2="592" y2="220" stroke="#06b6d4" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
    <line x1="208" y1="280" x2="592" y2="300" stroke="#06b6d4" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
  </g>
  
  <!-- Model Predictive Control arc -->
  <path d="M 320 480 Q 400 420 480 480" fill="none" stroke="url(#accent2)" stroke-width="2.5" opacity="0.7"/>
  <polygon points="480,480 470,475 470,485" fill="#3b82f6" opacity="0.8"/>
  
  <!-- Floating scan particles -->
  <circle cx="150" cy="400" r="3" fill="#06b6d4" opacity="0.6">
    <animate attributeName="cy" values="400;380;400" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="420" r="4" fill="#3b82f6" opacity="0.6">
    <animate attributeName="cy" values="420;400;420" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="100" r="3" fill="#06b6d4" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Bottom accent line -->
  <line x1="0" y1="550" x2="800" y2="550" stroke="url(#accent2)" stroke-width="3" opacity="0.5"/>
  
  <!-- Title overlay -->
  <text x="400" y="570" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8" opacity="0.8">
    CV + BIM + DIGITAL TWIN + MPC // REAL-TIME ENERGY EFFICIENCY
  </text>
</svg>
