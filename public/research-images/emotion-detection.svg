<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg2)"/>
  
  <!-- Floating text bubbles representing emotions -->
  <g opacity="0.3">
    <circle cx="200" cy="150" r="60" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="5,5">
      <animate attributeName="r" values="55;65;55" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="200" r="80" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="5,5">
      <animate attributeName="r" values="75;85;75" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Central text processing visualization -->
  <g transform="translate(400, 280)">
    <!-- Text input lines -->
    <rect x="-180" y="-100" width="140" height="20" rx="4" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.7"/>
    <rect x="-180" y="-70" width="180" height="20" rx="4" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.7"/>
    <rect x="-180" y="-40" width="120" height="20" rx="4" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Processing arrow -->
    <path d="M -30 -60 L 30 -60 L 20 -70 M 30 -60 L 20 -50" stroke="url(#accent2)" stroke-width="2" fill="none"/>
    
    <!-- Emotion outputs -->
    <g transform="translate(50, -110)">
      <rect x="0" y="0" width="100" height="22" rx="11" fill="rgba(236,72,153,0.2)" stroke="#ec4899" stroke-width="1"/>
      <text x="50" y="15" text-anchor="middle" font-family="monospace" font-size="10" fill="#fbcfe8">JOY</text>
    </g>
    <g transform="translate(50, -80)">
      <rect x="0" y="0" width="100" height="22" rx="11" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="1"/>
      <text x="50" y="15" text-anchor="middle" font-family="monospace" font-size="10" fill="#93c5fd">SADNESS</text>
    </g>
    <g transform="translate(50, -50)">
      <rect x="0" y="0" width="100" height="22" rx="11" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="1"/>
      <text x="50" y="15" text-anchor="middle" font-family="monospace" font-size="10" fill="#fca5a5">ANGER</text>
    </g>
    <g transform="translate(50, -20)">
      <rect x="0" y="0" width="100" height="22" rx="11" fill="rgba(168,85,247,0.2)" stroke="#a855f7" stroke-width="1"/>
      <text x="50" y="15" text-anchor="middle" font-family="monospace" font-size="10" fill="#d8b4fe">SURPRISE</text>
    </g>
  </g>
  
  <!-- NLP Pipeline Visualization -->
  <g transform="translate(400, 420)" opacity="0.8">
    <line x1="-200" y1="0" x2="200" y2="0" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="-200" cy="0" r="8" fill="none" stroke="#a855f7" stroke-width="2"/>
    <circle cx="-100" cy="0" r="8" fill="none" stroke="#a855f7" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#a855f7" filter="url(#glow2)"/>
    <circle cx="100" cy="0" r="8" fill="none" stroke="#ec4899" stroke-width="2"/>
    <circle cx="200" cy="0" r="8" fill="none" stroke="#ec4899" stroke-width="2"/>
    
    <text x="-200" y="-15" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd">RAW</text>
    <text x="-100" y="-15" text-anchor="middle" font-family="monospace" font-size="9" fill="#c4b5fd">CLEAN</text>
    <text x="0" y="-15" text-anchor="middle" font-family="monospace" font-size="9" fill="#f0abfc">BERT</text>
    <text x="100" y="-15" text-anchor="middle" font-family="monospace" font-size="9" fill="#fbcfe8">FEATURES</text>
    <text x="200" y="-15" text-anchor="middle" font-family="monospace" font-size="9" fill="#fbcfe8">CLASSIFY</text>
  </g>
  
  <!-- Floating particles -->
  <circle cx="100" cy="300" r="3" fill="#ec4899" opacity="0.6">
    <animate attributeName="cy" values="300;280;300" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="350" r="4" fill="#a855f7" opacity="0.6">
    <animate attributeName="cy" values="350;330;350" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="450" r="2" fill="#ec4899" opacity="0.8">
    <animate attributeName="cy" values="450;440;450" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Bottom accent -->
  <line x1="0" y1="550" x2="800" y2="550" stroke="url(#accent2)" stroke-width="3" opacity="0.5"/>
  
  <!-- Title -->
  <text x="400" y="570" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8" opacity="0.8">
    NLP PIPELINE // TEXT EMOTION CLASSIFICATION // BERT + ML
  </text>
</svg>
