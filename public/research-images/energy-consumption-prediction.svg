<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg1)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f59e0b" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="800" height="600" fill="url(#grid1)"/>
  
  <!-- Cityscape silhouette -->
  <g opacity="0.4">
    <rect x="80" y="320" width="60" height="180" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="160" y="260" width="80" height="240" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="260" y="340" width="50" height="160" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="330" y="280" width="90" height="220" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="440" y="300" width="70" height="200" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="530" y="250" width="100" height="250" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="650" y="310" width="60" height="190" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  
  <!-- Heat island overlay -->
  <g opacity="0.3">
    <circle cx="400" cy="350" r="180" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="8,4">
      <animate attributeName="r" values="170;190;170" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="350" r="120" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="6,6">
      <animate attributeName="r" values="110;130;110" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- CNN-LSTM neural flow -->
  <g opacity="0.7">
    <!-- Input nodes -->
    <circle cx="200" cy="150" r="10" fill="none" stroke="#f59e0b" stroke-width="2" filter="url(#glow1)"/>
    <circle cx="200" cy="220" r="10" fill="none" stroke="#f59e0b" stroke-width="2" filter="url(#glow1)"/>
    <circle cx="200" cy="290" r="10" fill="none" stroke="#f59e0b" stroke-width="2" filter="url(#glow1)"/>
    
    <!-- CNN hidden layer -->
    <circle cx="400" cy="180" r="14" fill="none" stroke="#ef4444" stroke-width="2.5" filter="url(#glow1)"/>
    <circle cx="400" cy="260" r="14" fill="none" stroke="#ef4444" stroke-width="2.5" filter="url(#glow1)"/>
    
    <!-- LSTM temporal layer -->
    <rect x="560" y="160" width="80" height="30" rx="6" fill="none" stroke="#10b981" stroke-width="2" filter="url(#glow1)"/>
    <rect x="560" y="220" width="80" height="30" rx="6" fill="none" stroke="#10b981" stroke-width="2" filter="url(#glow1)"/>
    
    <!-- Connections -->
    <line x1="210" y1="150" x2="386" y2="180" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <line x1="210" y1="220" x2="386" y2="180" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <line x1="210" y1="290" x2="386" y2="260" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <line x1="210" y1="220" x2="386" y2="260" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    
    <line x1="414" y1="180" x2="560" y2="175" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
    <line x1="414" y1="260" x2="560" y2="235" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Energy prediction output graph -->
  <g transform="translate(400, 460)" opacity="0.8">
    <polyline points="-150,-20 -100,-10 -50,-25 0,-15 50,-30 100,-10 150,-20" fill="none" stroke="url(#accent1)" stroke-width="2.5"/>
    <circle cx="-150" cy="-20" r="3" fill="#f59e0b"/>
    <circle cx="-100" cy="-10" r="3" fill="#f59e0b"/>
    <circle cx="-50" cy="-25" r="3" fill="#f59e0b"/>
    <circle cx="0" cy="-15" r="3" fill="#10b981"/>
    <circle cx="50" cy="-30" r="3" fill="#f59e0b"/>
    <circle cx="100" cy="-10" r="3" fill="#10b981"/>
    <circle cx="150" cy="-20" r="3" fill="#10b981"/>
  </g>
  
  <!-- Floating data particles -->
  <circle cx="120" cy="100" r="4" fill="#f59e0b" opacity="0.7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="120" r="3" fill="#10b981" opacity="0.7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="80" r="5" fill="#ef4444" opacity="0.6">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Bottom accent line -->
  <line x1="0" y1="550" x2="800" y2="550" stroke="url(#accent1)" stroke-width="3" opacity="0.5"/>
  
  <!-- Title overlay -->
  <text x="400" y="570" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8" opacity="0.8">
    CNN-LSTM + UHI FEATURES // CLIMATE-RESILIENT ENERGY PREDICTION
  </text>
</svg>
